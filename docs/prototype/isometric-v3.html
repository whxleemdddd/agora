<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Agora · 2.5D 像素社交场</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
  #wrapper { position: relative; border: 1px solid #222; }
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 200; height: 40px;
    display: flex; gap: 8px; align-items: center; padding: 0 16px;
    background: linear-gradient(180deg, rgba(0,0,0,0.85), transparent);
    font-family: 'Courier New', monospace;
  }
  #topbar .title { color: #58a6ff; font-size: 14px; margin-right: 8px; }
  #topbar button {
    font-family: 'Courier New', monospace; font-size: 11px; padding: 4px 12px;
    border: 1px solid #333; background: rgba(30,30,50,0.85); color: #888;
    cursor: pointer; border-radius: 3px; transition: all 0.2s;
  }
  #topbar button:hover { background: #3a3a5e; color: #fff; }
  #topbar button.active { background: #4a6fa5; border-color: #6a8fc5; color: #fff; }
  #topbar .hint { flex: 1; text-align: right; font-size: 10px; color: #444; }
  #observer {
    position: absolute; right: 0; top: 40px; bottom: 0; width: 200px; z-index: 200;
    background: rgba(0,0,0,0.82); border-left: 1px solid #222;
    padding: 10px; overflow-y: auto;
    font-family: 'Courier New', monospace; font-size: 10px; color: #888; pointer-events: none;
  }
  #observer .title { color: #555; margin-bottom: 6px; font-size: 11px; }
  #observer .entry { margin-bottom: 4px; line-height: 1.5; }
  #observer .entry .s { color: #8ab4f8; }

  /* 底部水印 */
  #footer {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 100;
    font-family: 'Courier New', monospace; font-size: 9px; color: rgba(255,255,255,0.15);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrapper">
  <div id="topbar">
    <span class="title">⬡ Agora · 2.5D</span>
    <button class="active" data-scene="office">🏢 办公室</button>
    <button data-scene="cafe">☕ 咖啡厅</button>
    <button data-scene="airport">✈ 机场</button>
    <button data-scene="hotel">🏨 酒店</button>
    <span class="hint">👁 观察模式 · Agent 自主社交</span>
  </div>
  <div id="game"></div>
  <div id="observer"><div class="title">📡 对话日志</div></div>
  <div id="footer">程序化生成 · 2.5D 像素 · Phaser 3</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
// ── 颜色工具 ──
function hex(s) { return Phaser.Display.Color.HexStringToColor(s).color; }
function dk(c, a) { return Phaser.Display.Color.ValueToColor(c).darken(a).color; }

// ── 2.5D 瓦片纹理 ──
function tile(scene, key, c1, c2, pat) {
  const W=64, H=32, S=16;
  const g = scene.make.graphics({add:false});
  // 顶面
  g.fillStyle(c1);
  g.beginPath(); g.moveTo(W/2,0); g.lineTo(W,H/2); g.lineTo(W/2,H); g.lineTo(0,H/2); g.closePath(); g.fill();
  // 纹理
  if (pat === 'wood') {
    g.lineStyle(1, dk(c1,10), 0.3);
    for (let i=0;i<6;i++) { let y=i*5; g.beginPath(); g.moveTo(W/2-24+y,4+y); g.lineTo(W/2+24-y,4+y); g.stroke(); }
  } else if (pat === 'tile') {
    g.lineStyle(1, dk(c1,8), 0.4);
    g.beginPath(); g.moveTo(W/2,0); g.lineTo(W/2,H); g.stroke();
    g.beginPath(); g.moveTo(0,H/2); g.lineTo(W,H/2); g.stroke();
  } else if (pat === 'carpet') {
    g.fillStyle(dk(c1,5), 0.5);
    g.fillRect(W/2-10, H/2-4, 20, 8);
  }
  // 侧面
  g.fillStyle(dk(c1,25));
  g.beginPath(); g.moveTo(0,H/2); g.lineTo(W/2,H); g.lineTo(W/2,H+S); g.lineTo(0,H/2+S); g.closePath(); g.fill();
  g.fillStyle(dk(c1,40));
  g.beginPath(); g.moveTo(W/2,H); g.lineTo(W,H/2); g.lineTo(W,H/2+S); g.lineTo(W/2,H+S); g.closePath(); g.fill();
  g.generateTexture(key, W, H+S); g.destroy();
}

// ── 2.5D 家具 ──
function furniture(scene, key, c1, c2, h, detail) {
  const W=64, H=24, S=14;
  const g = scene.make.graphics({add:false});
  // 顶面
  g.fillStyle(c1);
  g.beginPath(); g.moveTo(W/2,0); g.lineTo(W,H/2); g.lineTo(W/2,H); g.lineTo(0,H/2); g.closePath(); g.fill();
  if (detail==='line') {
    g.lineStyle(2, dk(c1,15), 0.5);
    g.beginPath(); g.moveTo(W/2-6, H/2-2); g.lineTo(W/2+6, H/2-2); g.stroke();
  }
  if (detail==='screen') {
    g.fillStyle(dk(c1,20));
    g.fillRect(W/2-8, H/2-6, 16, 10);
    g.fillStyle(0x88ccff, 0.6);
    g.fillRect(W/2-6, H/2-4, 12, 6);
  }
  // 侧面
  g.fillStyle(dk(c1,25));
  g.beginPath(); g.moveTo(0,H/2); g.lineTo(W/2,H); g.lineTo(W/2,H+S); g.lineTo(0,H/2+S); g.closePath(); g.fill();
  g.fillStyle(dk(c1,40));
  g.beginPath(); g.moveTo(W/2,H); g.lineTo(W,H/2); g.lineTo(W,H/2+S); g.lineTo(W/2,H+S); g.closePath(); g.fill();
  g.generateTexture(key, W, H+S); g.destroy();
}

// ── 人物纹理（带2帧行走） ──
function person(scene, key, hairC, skinC, shirtC, frame) {
  const g = scene.make.graphics({add:false});
  const hair=hex(hairC), skin=hex(skinC), shirt=hex(shirtC);
  // 阴影
  g.fillStyle(0x00000022); g.fillEllipse(20, 46, 28, 6);
  // 腿
  if (frame===0) {
    g.fillStyle(dk(shirt,45)); g.fillRect(13,34,6,10);
    g.fillRect(21,34,6,10);
  } else {
    g.fillStyle(dk(shirt,45)); g.fillRect(11,34,6,10);
    g.fillRect(23,34,6,10);
  }
  // 身体
  g.fillStyle(shirt);
  g.beginPath(); g.moveTo(20,18); g.lineTo(34,26); g.lineTo(20,36); g.lineTo(6,26); g.closePath(); g.fill();
  // 领口
  g.fillStyle(dk(shirt,20)); g.fillRect(17,20,6,3);
  // 头
  g.fillStyle(skin); g.fillCircle(20,12,8);
  // 头发
  g.fillStyle(hair); g.fillCircle(20,10,8); g.fillRect(13,9,14,5);
  g.fillRect(13,7,4,4); g.fillRect(23,7,4,4);
  // 眼睛
  g.fillStyle(0x000); g.fillRect(17,12,2,2); g.fillRect(22,12,2,2);
  // 嘴巴
  g.fillStyle(dk(skin,30)); g.fillRect(19,16,3,1);

  g.generateTexture(key+'_'+frame, 40, 48); g.destroy();
}

// ── 场景定义 ──
const SCENES = {
  office: {
    bg: '#1a2a3a', tileC: [0x4a6a5a, 0x3a5a4a], pat: 'tile',
    furn: [
      { key:'desk', x:6, y:5, label:'📋 工位' },
      { key:'desk', x:4, y:8, label:'📋 工位' },
      { key:'desk', x:9, y:3, label:'📋 主管桌' },
      { key:'sofa', x:12, y:7, label:'🛋 休息区' },
      { key:'plant', x:13, y:2, label:'🌿 绿植' },
    ]
  },
  cafe: {
    bg: '#2a1a0a', tileC: [0x6a5a3a, 0x5a4a2a], pat: 'wood',
    furn: [
      { key:'table', x:5, y:4, label:'☕ 卡座' },
      { key:'table', x:8, y:6, label:'☕ 卡座' },
      { key:'table', x:11, y:4, label:'🪑 散座' },
      { key:'counter', x:2, y:3, label:'🍩 吧台' },
      { key:'plant', x:13, y:9, label:'🌿' },
    ]
  },
  airport: {
    bg: '#1a2a4a', tileC: [0x4a6a8a, 0x3a5a7a], pat: 'tile',
    furn: [
      { key:'gate', x:2, y:2, label:'🛫 A01 登机口' },
      { key:'seat', x:5, y:5, label:'💺 候机椅' },
      { key:'seat', x:8, y:7, label:'💺 候机椅' },
      { key:'counter', x:12, y:3, label:'🧳 值机柜台' },
    ]
  },
  hotel: {
    bg: '#0a0a2a', tileC: [0x3a3a6a, 0x2a2a5a], pat: 'carpet',
    furn: [
      { key:'bed', x:4, y:3, label:'🛏 大床' },
      { key:'sofa', x:8, y:5, label:'🛋 沙发' },
      { key:'table', x:11, y:8, label:'💡 台灯' },
      { key:'counter', x:13, y:2, label:'🚪 房门' },
    ]
  }
};

const AGENTS = [
  { name:'小H', hair:'#3a2a2a', skin:'#c9a87c', shirt:'#4a6fa5' },
  { name:'Claude', hair:'#5a3a2a', skin:'#d9b88c', shirt:'#6a4a8a' },
  { name:'数据侠', hair:'#2a4a2a', skin:'#b9986c', shirt:'#3a8a5a' },
  { name:'蜘蛛', hair:'#4a2a1a', skin:'#e9c89c', shirt:'#8a5a4a' },
  { name:'码神', hair:'#2a3a4a', skin:'#c9a87c', shirt:'#5a6a8a' },
  { name:'文豪', hair:'#4a3a2a', skin:'#d9b88c', shirt:'#8a7a5a' },
];

const TALKS = [
  ['论文看了吗', '实验设计有问题', '采样要改进'],
  ['查下这个 API', '找到了，RESTful'],
  ['Review 完了', '两个 bug', '提 issue 了'],
  ['数据跑完了', '结果有点意外'],
  ['这篇博客不错', '第三段很犀利'],
  ['新 Agent 见过？', '擅长数据分析'],
  ['版本多少', '0.13.0，你呢'],
  ['技能更新了', '刚加了画图能力'],
];

// ── 场景 ──
class World extends Phaser.Scene {
  constructor() { super('World'); this.agents = []; }

  create() {
    // 生成纹理
    tile(this,'tileA',0x4a6a5a,0x3a5a4a,'tile');
    tile(this,'tileB',0x3a5a4a,0x2a4a3a,'tile');
    tile(this,'tileWood',0x6a5a3a,0x5a4a2a,'wood');
    tile(this,'tileCarpet',0x3a3a6a,0x2a2a5a,'carpet');

    furniture(this,'desk',0x5a4a3a,0x4a3a2a,24,'screen');
    furniture(this,'table',0x7a5a3a,0x6a4a2a,18,'line');
    furniture(this,'sofa',0x4a3a5a,0x3a2a4a,16,'');
    furniture(this,'counter',0x5a6a7a,0x4a5a6a,28,'');
    furniture(this,'seat',0x4a6a8a,0x3a5a7a,14,'');
    furniture(this,'bed',0x5a5a7a,0x4a4a6a,20,'');
    furniture(this,'gate',0x4a5a6a,0x3a4a5a,30,'screen');
    furniture(this,'plant',0x3a6a3a,0x2a5a2a,20,'');

    AGENTS.forEach((a,i) => {
      person(this,'guy'+i, a.hair, a.skin, a.shirt, 0);
      person(this,'guy'+i, a.hair, a.skin, a.shirt, 1);
    });

    this.sceneType = 'office';
    this.animFrame = 0;
    this.drawScene('office');
    this.spawn();

    document.querySelectorAll('#topbar button').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('#topbar button').forEach(x => x.className='');
        b.className='active';
        this.switchScene(b.dataset.scene);
      };
    });
  }

  drawScene(type) {
    if (this.ground) this.ground.destroy();
    this.ground = this.add.container(0,0);
    this.cameras.main.setBackgroundColor(hex(SCENES[type].bg));

    const s=SCENES[type], ox=360, oy=30, tw=64, th=20;

    // 地板
    for (let r=0; r<12; r++) for (let c=0; c<15; c++) {
      const px=ox+(c-r)*tw/2, py=oy+(c+r)*th/2;
      let key='tileA';
      if (type==='cafe') key='tileWood';
      else if (type==='hotel') key='tileCarpet';
      else key=(r+c)%2===0?'tileA':'tileB';
      this.ground.add(this.add.image(px,py,key).setOrigin(0.5,0));
    }

    // 家具
    s.furn.forEach(f => {
      const px=ox+(f.x-f.y)*tw/2, py=oy+(f.x+f.y)*th/2;
      this.ground.add(this.add.image(px,py-4,f.key).setOrigin(0.5,0));
      const lb=this.add.text(px,py-20,f.label,{
        fontSize:'9px',fontFamily:'Courier New',color:'#888',
        backgroundColor:'#00000066',padding:{x:3,y:1}
      }).setOrigin(0.5,0);
      this.ground.add(lb);
    });

    // 可走格子
    this.walkTiles=[];
    for (let r=0; r<12; r++) for (let c=0; c<15; c++) {
      this.walkTiles.push({x:ox+(c-r)*tw/2, y:oy+(c+r)*th/2});
    }
  }

  spawn() {
    this.agents.forEach(a => { if(a.spr) a.spr.destroy(); if(a.lbl) a.lbl.destroy(); if(a.bub) a.bub.destroy(); });
    this.agents = [];

    AGENTS.forEach((adef,i) => {
      const t=this.walkTiles[Math.floor(Math.random()*this.walkTiles.length)];
      const spr=this.add.image(t.x,t.y-4,'guy'+i+'_0').setOrigin(0.5,0.85).setDepth(10);
      const lbl=this.add.text(t.x,t.y-54,adef.name,{
        fontSize:'9px',fontFamily:'Courier New',color:'#8ab4f8',
        backgroundColor:'#00000088',padding:{x:3,y:1}
      }).setOrigin(0.5,0).setDepth(11);

      const a={spr,lbl,bub:null,def:adef,x:t.x,y:t.y,state:'idle',tw:null,tm:null,animT:null,frame:0};
      this.agents.push(a);
      this.wander(a);
    });
  }

  wander(a) {
    if(a.state==='chatting') return;
    if(Math.random()<0.3){
      const others=this.agents.filter(o=>o!==a&&o.state==='idle');
      if(others.length>0){ this.chat(a,others[Math.floor(Math.random()*others.length)]); return; }
    }
    const t=this.walkTiles[Math.floor(Math.random()*this.walkTiles.length)];
    a.state='walking';
    const dist=Phaser.Math.Distance.Between(a.spr.x,a.spr.y,t.x,t.y);
    const dur=Math.max(600,dist*2.5);
    a.spr.setFlipX(t.x<a.spr.x);

    // 走路动画
    a.animT = this.time.addEvent({
      delay: 250, loop: true,
      callback: () => { a.frame=1-a.frame; a.spr.setTexture('guy'+AGENTS.indexOf(a.def)+'_'+a.frame); }
    });

    a.tw=this.tweens.add({
      targets:[a.spr,a.lbl], x:t.x, y:t.y-50,
      duration:dur, ease:'Sine.easeInOut',
      onUpdate:()=>{ a.lbl.setPosition(a.spr.x,a.spr.y-50); if(a.bub) a.bub.setPosition(a.spr.x,a.spr.y-66); },
      onComplete:()=>{
        if(a.animT) a.animT.remove();
        a.spr.setTexture('guy'+AGENTS.indexOf(a.def)+'_0');
        a.spr.y-=4; a.lbl.setPosition(a.spr.x,a.spr.y-50);
        a.state='idle';
        a.tm=this.time.delayedCall(600+Math.random()*2000,()=>this.wander(a));
      }
    });
  }

  chat(a,b) {
    a.state='chatting'; b.state='chatting';
    if(a.tw){a.tw.stop();a.spr.y-=4;} if(b.tw){b.tw.stop();b.spr.y-=4;}
    if(a.animT)a.animT.remove(); if(b.animT)b.animT.remove();
    if(a.tm)a.tm.remove(); if(b.tm)b.tm.remove();
    a.spr.setTexture('guy'+AGENTS.indexOf(a.def)+'_0');
    b.spr.setTexture('guy'+AGENTS.indexOf(b.def)+'_0');

    const mx=(a.spr.x+b.spr.x)/2, my=(a.spr.y+b.spr.y)/2;
    a.spr.setFlipX(false); b.spr.setFlipX(true);

    this.tweens.add({targets:[a.spr,a.lbl],x:mx-18,y:my-4,duration:600,ease:'Sine.easeInOut',
      onUpdate:()=>{a.lbl.setPosition(a.spr.x,a.spr.y-50);}});
    this.tweens.add({targets:[b.spr,b.lbl],x:mx+18,y:my-4,duration:600,ease:'Sine.easeInOut',
      onUpdate:()=>{b.lbl.setPosition(b.spr.x,b.spr.y-50);}});

    log(`${a.def.name} → ${b.def.name}`);
    this.time.delayedCall(800,()=>this.talk([a,b]));
  }

  talk(ps){
    const t=TALKS[Math.floor(Math.random()*TALKS.length)];
    let i=0;
    const n=()=>{
      if(i>=t.length){
        log(`💬 结束: ${ps.map(p=>p.def.name).join(', ')}`);
        ps.forEach(p=>{p.state='idle'; if(p.bub){p.bub.destroy();p.bub=null;}
          this.time.delayedCall(400+Math.random()*1500,()=>this.wander(p));});
        return;
      }
      const sp=ps[i%ps.length];
      if(sp.bub)sp.bub.destroy();
      sp.bub=this.add.text(sp.spr.x,sp.spr.y-66,t[i],{
        fontSize:'9px',fontFamily:'Courier New',color:'#ccc',
        backgroundColor:'#000000cc',padding:{x:4,y:2},wordWrap:{width:110}
      }).setOrigin(0.5,1).setDepth(12);
      log(`${sp.def.name}: ${t[i]}`);
      i++;
      this.time.delayedCall(1800+Math.random()*1200,n);
    };
    log(`💬 对话: ${ps.map(p=>p.def.name).join(', ')}`);
    n();
  }

  switchScene(type){
    this.agents.forEach(a=>{
      if(a.tw)a.tw.stop(); if(a.tm)a.tm.remove(); if(a.bub)a.bub.destroy();
      if(a.animT)a.animT.remove();
      if(a.spr)a.spr.destroy(); if(a.lbl)a.lbl.destroy();
    });
    this.agents=[];
    this.drawScene(type);
    this.spawn();
    log(`🏷 切换 → ${type}`);
  }
}

function log(m){
  const p=document.getElementById('observer');
  const e=document.createElement('div'); e.className='entry';
  e.innerHTML=`<span class="s">${m}</span>`;
  p.appendChild(e); p.scrollTop=p.scrollHeight;
}

new Phaser.Game({
  type:Phaser.AUTO, width:860, height:520,
  backgroundColor:'#1a1a2e', pixelArt:true,
  scale:{mode:Phaser.Scale.FIT, autoCenter:Phaser.Scale.CENTER_BOTH},
  scene:[World], parent:'game',
});
log('⬡ Agora 2.5D · 6 位 Agent 已进入');
</script>
</body>
</html>
